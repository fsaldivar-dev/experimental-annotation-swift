name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Swift ${{ matrix.swift }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            swift: "6.1"
          - os: macos-26
            swift: "6.2"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
      - name: Build and run the Demo client package
        run: swift run --package-path Examples/Demo
      - name: Test the AdminApp example
        run: swift test --package-path Examples/AdminApp
