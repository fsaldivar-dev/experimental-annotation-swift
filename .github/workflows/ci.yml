name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Swift ${{ matrix.swift }} (Xcode ${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            xcode: "26.1"
            swift: "6.2"
          - os: macos-26
            xcode: "26.6"
            swift: "6.3"
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          ls /Applications | grep -i xcode
          swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
      - name: Build and run the Demo client package
        run: swift run --package-path Examples/Demo
      - name: Test the AdminApp example
        run: swift test --package-path Examples/AdminApp
